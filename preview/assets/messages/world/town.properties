world.world.desc_maud=The innkeeper of Lantern's Rest, broad and unhurried, with a lantern always at her hip.
world.world.desc_odile=A sister of the chapel, sleeves rolled, hands that smell of vinegar and myrrh.
world.world.desc_garrick=The smith. Soot to the elbows and opinions to match.
world.world.desc_wenna=An apothecary without her cart, sorting empty jars.
world.world.desc_ragpicker=A heap of coats with someone inside, guarding a heap of things with no one inside.
world.world.desc_cael=A young brother who keeps the cold altar as if it might wake.
world.world.desc_confessor=A hooded figure behind a lattice. It waits.
world.world.desc_hobb=The sexton. He has buried half the parish and remembers all of it.
world.world.desc_strongbox=An iron-banded chest bolted to the inn floor. What you leave here stays.
world.world.maud_bark=Mind the fog, love. Your things are safe with me.
world.world.maud_talk=This was a coaching inn before the fog. Now it's the only door in the parish that still locks.
world.world.maud_open=Open the strongbox
world.world.npc_talk=Talk
world.world.npc_farewell=Farewell
world.world.npc_says=%s: "%s"
world.world.strongbox_stiff=The strongbox is stiff. Try again soon.
world.world.odile_heal=Be still. There.
world.world.odile_full=You are whole. Go with the light.
world.world.garrick=Iron's honest. Can't say the same for the road.
world.world.garrick_sell=Sell wares
world.world.wenna=My cart never came back from the moor. When it does, so will my remedies.
world.world.ragpicker=Everything here was somebody's. Now it could be yours, for a price. Later.
world.world.cael=The Altar is cold. Bring me the bell-rope and we will see.
world.world.confessor=Return when you have more to confess.
world.world.hobb_1=The lanterns burned all night once. Light them again and the road remembers you.
world.world.hobb_2=Your little lantern can carry you home. Three breaths, and don't get hit.
world.world.hobb_3=The cellars under Sallowmere flood with the tide of the mere.
world.world.hobb_4=Don't go to the abbey until the bone-house stops singing.
world.world.drop_hint=Things left on the ground are gone when you leave the parish. Maud's strongbox keeps them.
