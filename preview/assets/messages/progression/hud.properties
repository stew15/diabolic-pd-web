# Diabolic M3 HUD text (docs/arch/30-m3-design.md §8.3, §8.13): the Mana orb, the quickbar and the
# potion belt. English only. Keys are progression.hud.<key>, read with Messages.get("progression.hud.<key>",
# args); values are String.format patterns. Owned by the HUD tasks; skill names live in the tree JSON.
progression.hud.mana=Mana
progression.hud.level_up=Level %1$d — +%2$d attributes · +%3$d skill point
# U1-31 (docs/arch/35-ui-pass-design.md §10.3): the level-up toast (its parts joined by " · "), its [Spend], the
# Character footer's link while both kinds of points wait, the unspent badge's hover text
progression.hud.levelup_level=Level %d
progression.hud.levelup_attr_one=1 attribute point
progression.hud.levelup_attr=%d attribute points
progression.hud.levelup_skill_one=1 skill point
progression.hud.levelup_skill=%d skill points
progression.hud.levelup_spend=Spend
progression.hud.levelup_then=Then: Skills (%d)
progression.hud.levelup_badge_hover=Spend points

# the quickbar, the potion belt and the Command tag (M3-18, §8.1-§8.4)
progression.hud.slot_empty=Empty skill slot
# U1-25 (docs/arch/35-ui-pass-design.md §10.5): the targeting prompt by device and state. Arguments: %1$s the skill,
# %2$s the slot's key, %3$s the cancel key (keyboard only). "_none": the auto target found no foe (or place).
progression.hud.prompt_target=Tap a foe for %1$s, or tap %1$s again for the marked foe
progression.hud.prompt_target_none=No foe in reach for %1$s. Tap a foe, or the X
