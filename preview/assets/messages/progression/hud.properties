progression.hud.prompt_cell_pad=A: marked place · stick: move · B: cancel
progression.hud.prompt_cell_pad_none=A: here · stick: move · B: cancel
progression.hud.prompt_target_keys=%2$s: marked foe · click: choose · %3$s: cancel
progression.hud.prompt_target_keys_none=No foe in reach for %1$s · click a foe · %3$s: cancel
progression.hud.prompt_cell_keys=%2$s: marked place · click: choose · %3$s: cancel
progression.hud.prompt_cell_keys_none=Click a place for %1$s · %3$s: cancel
