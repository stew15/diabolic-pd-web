# Diabolic M3 aim mode text (docs/arch/30-m3-design.md §8.5, §8.6, §8.13). English only.
# Keys are progression.aim.<key>, read with Messages.get("progression.aim.<key>", args); values are
# String.format patterns. Owned by M3-21 (scenes/AimMode, ui/world/AimOverlay, SkillInput's aim preview).
progression.aim.title=Aim

# the numbers over a foe in the preview (AimOverlay): damage range and the chance to land
progression.aim.range=%1$d-%2$d
progression.aim.hit=%d%%

# what the previewed skill lays on a foe (SkillInput.statuses): kept short, they sit over the figure
progression.aim.status_hex=hex %dt
progression.aim.status_turns=%dt
progression.aim.status_stacks=%1$d/%2$d
progression.aim.status_bleed=bleed %d
progression.aim.status_taken=+%d%% taken
