<script>
/* ---- canvas placement: full-bleed; the UI stays inside the iOS safe area (M3-42) -------------------
   The canvas covers the whole visible screen, so the game draws under the status bar, the Dynamic Island
   and the home indicator (viewport-fit=cover) and nothing is letterboxed. The safe-area insets go to the
   game instead: window.__epdFrame.insets [top, right, bottom, left] in canvas px (= CSS px), read by
   WebPlatformSupport.getSafeInsets, keep the HUD, every window and every other control inside them.
   WebLauncher uses width/height -1, so gdx-teavm never sizes the canvas; this script does, and the game
   picks the new backbuffer size up on its next frame (Game.resize -> scene reset/relayout, like desktop).
   Backbuffer = CSS px (1:1, no stretching), upscaled with nearest-neighbour on integer-DPR screens.
   Re-run live on resize / visualViewport resize and scroll / orientationchange / screen.orientation change /
   ResizeObserver and a 500 ms poll, so a foldable switching screens (iPhone Duo outer <-> inner) without a
   reload, and Safari's toolbars collapsing or expanding, are picked up.
   Size rules (the whole visible area, never more):
   - Browser tab: the visual viewport (min(innerHeight, visualViewport.height), at its offset): Safari's
     toolbars can overlap the layout viewport.
   - Home Screen app (standalone, black-translucent + viewport-fit=cover): the whole screen. iOS can report
     innerHeight/100dvh short (by the status bar, or by the status bar and the home indicator: the owner's
     iPhone Duo, M3-42) while drawing the page from the very top of the screen. The full height is the
     largest of 100lvh, the screen size (only when the screen object describes this display: its short or
     long side matches the current width; a foldable can keep reporting the display it was launched on),
     outerHeight (when outerWidth matches) and the screen height last seen for this display (localStorage
     'epd-screen-h', keyed by orientation and width: recorded whenever the screen object did describe it,
     so a fold to a display the screen object no longer describes still knows its height), as long as the
     shortfall is status-bar sized (at most MAX_GAP_FRAC of the height); never taller than the screen
     when the screen object describes this display.
     A corrected height means iOS measured the insets against the short viewport: the bottom gets at least
     the home indicator's inset (34 portrait, 21 landscape), and if iOS reported no inset at all the gap is
     taken as the top inset (portrait), so the HUD stays clear of the status bar and the Dynamic Island.
   The insets the game gets are the safe area's overlap with the canvas (a tab's canvas can start below
   the layout viewport's top).
   Test hooks: ?epdInsets=top,right,bottom,left or window.__epdForceInsets = [t,r,b,l] override
   env(safe-area-inset-*); window.__epdForceStandalone = true fakes Home Screen mode;
   window.__epdComputeFrame(inputs) is the pure placement function (tools/web/phonefit.js checks it). */
(function () {
  var q = /[?&]epdInsets=([\d.,]+)/.exec(location.search);
  if (q) window.__epdForceInsets = q[1].split(',').map(Number);
  var MAX_GAP_FRAC = 0.25, HOME_P = 34, HOME_L = 21;
  function standalone() {
    if (window.__epdForceStandalone !== undefined) return !!window.__epdForceStandalone;
    return navigator.standalone === true ||
      (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  }
  /* pure: inputs -> {vw, vh, t, r, b, l, ox, oy, fix}: the canvas (ox, oy, vw x vh in page CSS px) and the
     safe-area insets measured from its edges */
  function computeFrame(i) {
    var env = (i.env || [0, 0, 0, 0]).map(function (v) { return Math.max(0, v || 0); });
    var t = env[0], r = env[1], b = env[2], l = env[3];
    var vw = i.innerW, vh = i.innerH, ox = 0, oy = 0, fix = '', seen = 0;
    var layoutW = vw, layoutH = vh;
    if (i.clientW > 0 && Math.abs(i.clientW - vw) < 2) vw = layoutW = i.clientW;
    if (!i.standalone) {
      var vv = i.vv;
      if (vv && vv.w > 0 && vv.h > 0 && Math.abs((vv.scale || 1) - 1) < 0.01) {
        if (vv.h < vh - 0.5) { vh = vv.h; oy = Math.max(0, vv.ot || 0); fix = 'vv-h'; }
        if (vv.w < vw - 0.5) { vw = vv.w; ox = Math.max(0, vv.ol || 0); fix += (fix ? '+' : '') + 'vv-w'; }
      }
    } else {
      var landscape = vw > vh;
      var cap = vh * MAX_GAP_FRAC;
      var full = vh, src = '';
      var take = function (h, name) {
        if (h > full + 0.5 && h - vh <= cap) { full = h; src = name; }
      };
      take(i.lvh || 0, 'lvh');
      var sMin = Math.min(i.screenW || 0, i.screenH || 0), sMax = Math.max(i.screenW || 0, i.screenH || 0);
      var sW = landscape ? sMax : sMin, sH = landscape ? sMin : sMax;
      var screenOk = sW > 0 && Math.abs(sW - vw) <= 2;          /* screen object describes THIS display */
      if (screenOk) take(sH, 'screen');
      if (i.outerW > 0 && Math.abs(i.outerW - vw) <= 2) take(i.outerH || 0, 'outer');
      if (!screenOk) take(i.memo || 0, 'memo');
      if (screenOk && full > sH) full = sH;                     /* never taller than the screen */
      if (screenOk) seen = sH;
      if (full > vh + 0.5) {
        var gap = full - vh;
        fix = 'standalone-gap ' + Math.round(gap) + ' (' + src + ')';
        vh = layoutH = full;
        if (!i.forced) {
          if (t === 0 && r === 0 && b === 0 && l === 0 && !landscape) t = gap;  /* the status bar, unreported */
          b = Math.max(b, landscape ? HOME_L : HOME_P);                          /* the home indicator */
          fix += ' +insets';
        }
      }
    }
    /* the safe area's overlap with the canvas */
    t = Math.max(0, t - oy);
    l = Math.max(0, l - ox);
    b = Math.max(0, b - Math.max(0, layoutH - (oy + vh)));
    r = Math.max(0, r - Math.max(0, layoutW - (ox + vw)));
    return { vw: vw, vh: vh, t: t, r: r, b: b, l: l, ox: ox, oy: oy, fix: fix, seen: seen };
  }
  /* the screen heights seen per display ('p626': portrait, 626 CSS px wide) */
  var MEMO = 'epd-screen-h', memo = null;
  function memoKey(w, h) { return (w > h ? 'l' : 'p') + Math.round(w); }
  function memoGet(k) {
    if (memo === null) { try { memo = JSON.parse(localStorage.getItem(MEMO) || '{}') || {}; } catch (e) { memo = {}; } }
    return +memo[k] || 0;
  }
  function memoSet(k, v) {
    if (memoGet(k) === v) return;
    memo[k] = v;
    try { localStorage.setItem(MEMO, JSON.stringify(memo)); } catch (e) {}
  }
  window.__epdComputeFrame = computeFrame;
  var probe;
  function inputs() {
    if (!probe) {
      probe = document.createElement('div'); probe.id = 'epd-probe';
      (document.body || document.documentElement).appendChild(probe);
    }
    var cs = getComputedStyle(probe), vv = window.visualViewport, de = document.documentElement;
    var forced = window.__epdForceInsets;
    return {
      innerW: window.innerWidth, innerH: window.innerHeight, clientW: de ? de.clientWidth : 0,
      vv: vv ? { w: vv.width, h: vv.height, ot: vv.offsetTop, ol: vv.offsetLeft, scale: vv.scale } : null,
      lvh: parseFloat(cs.height) || 0, screenW: screen.width, screenH: screen.height,
      outerW: window.outerWidth || 0, outerH: window.outerHeight || 0,
      env: forced || [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].map(parseFloat),
      forced: !!forced, standalone: !!standalone(),
      memo: memoGet(memoKey(window.innerWidth, window.innerHeight))
    };
  }
  var last = '';
  function layout() {
    var c = document.getElementById('canvas');
    if (!c) return;
    var inp = inputs(), m = computeFrame(inp);
    if (m.seen > 0) memoSet(memoKey(inp.innerW, inp.innerH), Math.round(m.seen));
    var L = Math.round(m.ox), T = Math.round(m.oy);
    var W = Math.max(1, Math.floor(m.vw)), H = Math.max(1, Math.floor(m.vh));
    /* insets in canvas px, whole px, and never more than half the canvas each way */
    var ins = [Math.min(Math.ceil(m.t), H / 2), Math.min(Math.ceil(m.r), W / 2),
               Math.min(Math.ceil(m.b), H / 2), Math.min(Math.ceil(m.l), W / 2)].map(Math.floor);
    var key = [L, T, W, H].join(',');
    if (key !== last) {
      last = key;
      c.style.left = L + 'px'; c.style.top = T + 'px';
      c.style.width = W + 'px'; c.style.height = H + 'px';
    }
    if (c.width !== W) c.width = W;
    if (c.height !== H) c.height = H;
    var crisp = Math.abs((window.devicePixelRatio || 1) - Math.round(window.devicePixelRatio || 1)) < 0.01;
    c.classList.toggle('epd-crisp', crisp);
    window.__epdFrame = { left: L, top: T, width: W, height: H, insets: ins,
                          safe: [L + ins[3], T + ins[0], L + W - ins[1], T + H - ins[2]], vw: m.vw, vh: m.vh,
                          innerW: window.innerWidth, innerH: window.innerHeight, standalone: inp.standalone, fix: m.fix,
                          inputs: inp };
  }
  window.__epdLayout = layout;
  function burst() {
    layout();
    requestAnimationFrame(layout);
    [50, 150, 300, 600, 1000, 2000].forEach(function (t) { setTimeout(layout, t); });
  }
  window.__epdLayoutBurst = burst;
  document.addEventListener('DOMContentLoaded', function () {
    layout();
    if (window.ResizeObserver) { try { new ResizeObserver(burst).observe(document.documentElement); } catch (e) {} }
  });
  window.addEventListener('resize', burst);
  window.addEventListener('orientationchange', burst);
  window.addEventListener('pageshow', burst);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) burst(); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', burst);
    window.visualViewport.addEventListener('scroll', burst);
  }
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', burst);
  if (window.matchMedia) { try { matchMedia('(orientation: portrait)').addEventListener('change', burst); } catch (e) {} }
  window.addEventListener('load', function () { burst(); setInterval(layout, 500); });
  /* no pinch/double-tap zoom or page bounce */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
})();

/* ---- saves: make IndexedDB writes land before iOS suspends a hidden page ---------------------------
   gdx-teavm writes every file with its own one-request readwrite transaction; commit() it right away
   instead of waiting for the task to end. __epdIdbPending counts transactions not yet complete. */
(function () {
  if (!window.IDBObjectStore) return;
  window.__epdIdbPending = 0;
  var P = IDBObjectStore.prototype;
  ['put', 'delete'].forEach(function (m) {
    var orig = P[m];
    P[m] = function () {
      var req = orig.apply(this, arguments);
      try {
        var tx = this.transaction;
        if (tx && tx.mode === 'readwrite' && !tx.__epd) {
          tx.__epd = true;
          window.__epdIdbPending++;
          var done = function () { window.__epdIdbPending = Math.max(0, window.__epdIdbPending - 1); };
          tx.addEventListener('complete', done); tx.addEventListener('abort', done); tx.addEventListener('error', done);
          if (typeof tx.commit === 'function') tx.commit();
        }
      } catch (e) {}
      return req;
    };
  });
})();

/* ---- offline support + prompt updates ---------------------------------------------------------------
   The new service worker activates immediately (skipWaiting + clients.claim). When it takes over a page
   that already had an older one, reload once - right away on the title screen, or (mid-run) the next time
   the app comes back to the foreground, after the hide-save. Updates are checked on launch and resume. */
if ('serviceWorker' in navigator) {
  (function () {
    var hadController = !!navigator.serviceWorker.controller, pending = false, reloaded = false;
    function reload() { if (reloaded) return; reloaded = true; location.reload(); }
    function inRun() { return !!(window.__epdHud && window.__epdHud.inGame); }
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController) { hadController = true; return; }
      pending = true;
      if (!inRun()) reload();
    });
    setInterval(function () { if (pending && !inRun()) reload(); }, 2000);
    var reg = null;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { scope: './' })
        .then(function (r) { reg = r; })
        .catch(function (e) { console.warn('SW registration failed', e); });
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      if (pending) { reload(); return; }
      if (reg) reg.update().catch(function () {});
    });
  })();
}
if (navigator.storage && navigator.storage.persist) {
  window.addEventListener('load', function () {
    navigator.storage.persisted().then(function (p) { return p || navigator.storage.persist(); })
      .then(function (p) { window.__epdPersisted = p; }).catch(function () {});
  });
}
</script>
<script>
/* ---- loading message + on-screen error box ------------------------------------------------------------
   The game code is ~25 MB; until it has downloaded and started, the page would otherwise be plain black.
   Shows "Loading... Ns" until the game publishes window.__epdHud, and shows any script error, unhandled
   promise rejection or WebGL failure in a red box, so a phone user can screenshot what went wrong. */
(function () {
  var t0 = Date.now(), box, err, gone = false;
  function ui() {
    if (box) return;
    box = document.createElement('div');
    box.id = 'dpd-loading';
    box.style.cssText = 'position:fixed;left:0;right:0;top:42%;z-index:30;text-align:center;font:14px sans-serif;'
      + 'color:#cfc4a8;pointer-events:none;text-shadow:0 0 4px #000';
    (document.body || document.documentElement).appendChild(box);
  }
  function showError(msg) {
    if (!err) {
      err = document.createElement('div');
      err.id = 'dpd-error';
      err.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:40;font:12px monospace;color:#fff;'
        + 'background:rgba(140,20,30,0.92);padding:8px;border-radius:6px;white-space:pre-wrap;max-height:45%;overflow:auto';
      (document.body || document.documentElement).appendChild(err);
      err.textContent = 'Something went wrong - please screenshot this:\n';
    }
    err.textContent += '\n' + String(msg).slice(0, 600);
  }
  window.__dpdShowError = showError;
  window.addEventListener('error', function (e) {
    showError((e.message || 'error') + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showError('unhandled: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
  });
  /* WebGL availability: report if the game's canvas cannot get a context */
  var getCtx = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, opts) {
    var c = getCtx.call(this, type, opts);
    if (!c && /webgl/.test(type)) showError('WebGL context could not be created (' + type + ')');
    return c;
  };
  function tick() {
    if (gone) return;
    if (window.__epdHud) {
      gone = true;
      if (box) box.remove();
      return;
    }
    ui();
    var s = Math.round((Date.now() - t0) / 1000);
    box.textContent = 'Diabolic Pixel Dungeon\nLoading... ' + s + 's' + (s > 45 ? '\n(first load downloads ~25 MB)' : '');
    box.style.whiteSpace = 'pre';
    setTimeout(tick, 500);
  }
  document.addEventListener('DOMContentLoaded', tick);
})();
</script>
