# M4-34: the quest set pieces (section 7.2, 7.3)
world.quests.quests.wick_ready=The flame holds, but it answers no other yet. Sexton Hobb should hear it burns.
actors.mobs.npcs.poi.questprop.wreck_name=wrecked hand-cart
actors.mobs.npcs.poi.questprop.wreck_desc=Wenna's physic cart, tipped into the ditch with one wheel snapped. The shrouds heaped on it are not the cargo she sent. Deep ruts run south-west from it.
actors.mobs.npcs.poi.questprop.wreck_use=You turn back a shroud. Beneath it, only straw and the smell of rot. The ruts leave the road for the south-west.
actors.mobs.npcs.poi.questprop.wreck_spent=The cart lies where it tipped. Its ruts lead south-west.
actors.mobs.npcs.poi.questprop.garden_cart_name=Wenna's hand-cart
actors.mobs.npcs.poi.questprop.garden_cart_desc=The physic cart, scrubbed with lye and parked among the herb beds. Someone has mended the wheel with a fence rail.
actors.mobs.npcs.poi.questprop.garden_cart_use=The boards still smell of vinegar. It will not go out to Hagstone again soon.
actors.mobs.npcs.poi.questprop.garden_cart_spent=The cart rests among the herb beds.
actors.mobs.npcs.poi.questprop.satchel_name=Brother Tam's satchel
actors.mobs.npcs.poi.questprop.satchel_desc=A cracked leather satchel under the fallen mill-beams, the abbey's mark burned into its flap.
actors.mobs.npcs.poi.questprop.satchel_use=Inside: a bell-ringer's gloves and a scrap of parchment. "The wolves took it. The holt is open to me now; God forgive me, I will not follow." Somewhere north-east, a way stands open.
actors.mobs.npcs.poi.questprop.satchel_spent=Tam's satchel lies empty under the beams.
actors.mobs.npcs.poi.questprop.hook_name=bell-rope hook
actors.mobs.npcs.poi.questprop.hook_desc=An iron hook on a beam above the sealed stair, polished by a rope's long wear. Nothing hangs from it now.
actors.mobs.npcs.poi.questprop.hook_desc_hung=The severed bell-rope hangs from the hook again. The stair below lies open.
actors.mobs.npcs.poi.questprop.hook_bare=An empty hook above a sealed stair. Something once hung here, and the stair remembers it.
actors.mobs.npcs.poi.questprop.hook_use=You knot the severed rope to the hook. It tightens by itself, as though pulled from below, and the seal on the stair gives way.
actors.mobs.npcs.poi.questprop.hook_spent=The rope hangs still. The way down is open.
actors.mobs.npcs.poi.opengrave.name=open grave
actors.mobs.npcs.poi.opengrave.desc=A fresh-dug grave below Saint Ysolde's. The spoil is thrown wide and the coffin lid lies split beside it.
actors.mobs.npcs.poi.opengrave.desc_woken=An empty grave. Cart-ruts run from it toward the west.
actors.mobs.npcs.poi.opengrave.wake=You lean over the pit and the loose earth heaves. They were not all carried away.
actors.mobs.npcs.poi.opengrave.empty=Nothing more lies in this grave. The cart-ruts lead west.
world.quests.act1.odilesreliquary.relic_name=Saint Ysolde's knucklebone
world.quests.act1.odilesreliquary.relic_desc=A small brown bone in a silver cage no bigger than a thimble. It is warmer than it should be.
world.quests.act1.odilesreliquary.relic_taken=You wrap the knucklebone in a clean cloth. Sister Odile is waiting for it.
world.quests.act1.odilesreliquary.relic_kept=The knucklebone slips from your fingers and settles back where it lay. It will let itself be carried only by one who is sent for it.
windows.quests.wndepilogue.title=The Bell Is Silent
windows.quests.wndepilogue.body=Mother Aldreda lies under the black water of the nave, and the rope has gone slack at last. No stroke calls the dead up out of the mud of Merrow now, and Lantern's Rest sleeps through its first quiet night in a generation.\n\nIt was not cheaply done. The moor is pitted with graves you opened, and more of the lost stayed in the dark than came home with you.\n\nBeyond the mere the old causeway runs out into the Witchfen, but its stones lie under the flood, and no one yet knows how to raise them. Until they do, the moor, the abbey and its restless dead are yours to walk.
windows.quests.wndepilogue.close=Walk on
