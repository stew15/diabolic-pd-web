progression.hud.prompt_cell=Choose a place for %s, then press there or the skill again
progression.hud.belt_kind_healing=Healing Draught
progression.hud.belt_kind_mana=Mana Draught
progression.hud.belt_kind_rejuvenation=Rejuvenation Draught
progression.hud.belt_unset=Empty belt slot
progression.hud.belt_none=You have no %s left.
progression.hud.command=Command
progression.hud.command_desc=Your summons keep the stance you choose. Send them to a place to have them strike a foe there, come back to you, or hold that ground.
