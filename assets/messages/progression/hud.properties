# Diabolic M3 HUD text (docs/arch/30-m3-design.md §8.3, §8.13): the Mana orb, the quickbar and the
# potion belt. English only. Keys are progression.hud.<key>, read with Messages.get("progression.hud.<key>",
# args); values are String.format patterns. Owned by the HUD tasks; skill names live in the tree JSON.
progression.hud.mana=Mana
progression.hud.level_up=Level %1$d — +%2$d attributes · +%3$d skill point

# the quickbar, the potion belt and the Command tag (M3-18, §8.1-§8.4)
progression.hud.slot_empty=Empty skill slot
