progression.respec.recant_title=Recant a rite
progression.respec.recant_each=Each point returns for %d gold.
progression.respec.recant_total=Recanting %1$d: %2$d gold (you carry %3$d)
progression.respec.recant_none=Choose a rite and take a point back.
progression.respec.recant_confirm=Confirm (%d gold)
progression.respec.recant_cancel=Cancel
progression.respec.hint_recant_keys=- recants, + restores, Enter confirms, Esc cancels.
