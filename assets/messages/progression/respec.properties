progression.respec.title=Confession

# The Confessor's menu (WndConfessor).
progression.respec.greet=Kneel, then. Say what you would take back.
progression.respec.menu_body=Every rite you learned and every point you placed can be unsaid here, for coin.
progression.respec.menu_free=Your first full confession costs nothing.
progression.respec.menu_cost=A full confession costs %d gold.
progression.respec.menu_point=Each recanted point costs %d gold.
progression.respec.menu_gold=You carry %d gold.
progression.respec.confess=Confess everything (%d gold)
