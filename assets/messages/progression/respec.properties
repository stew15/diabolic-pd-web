progression.respec.confirm_title=Confess everything?
progression.respec.confirm_body=Every point returns to you, to place again: %1$d skill and %2$d attribute. Cooldowns stay; auras, toggles and stances end; the slots of rites you learn again are kept.
progression.respec.confirm_cost=The price: %d gold.
progression.respec.confirm_free=The price: nothing, this once.
progression.respec.confirm_yes=Confess
progression.respec.confirm_no=Not yet
progression.respec.confessed=You confess everything. Every point is yours to place again.

