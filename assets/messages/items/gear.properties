# Draughts (§9.4): class-derived keys, read with Messages.get(this, "name"|"desc").
# Grade words (Minor .. Superb) are items.gear.grade_1 .. grade_5 above.
items.draughts.healingdraught.name=Healing Draught
items.draughts.healingdraught.desc=A stoppered vial of dark red tincture, bitter with grave-moss and iron. Drunk down, it knits your wounds over the next three turns, mending a little over a third of your Life. Draughts share a short cooldown.
items.draughts.rejuvenationdraught.name=Rejuvenation Draught
items.draughts.rejuvenationdraught.desc=A thick, pale cordial that smells of crushed rue and candle smoke. It mends a little over a third of your Life in a single swallow. Draughts share a short cooldown.
